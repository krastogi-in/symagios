# Admin is loopback-only inside the container and is NOT published to the host.
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
    - name: symagios_gateway_ingress
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain:
                      filename: /certs/envoy-ingress/tls.crt
                    private_key:
                      filename: /certs/envoy-ingress/tls.key
                alpn_protocols: ["h2", "http/1.1"]
              require_client_certificate: false
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: symagios_gateway_https
                codec_type: AUTO
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "[ingress] %START_TIME% %REQ(:METHOD)% %REQ(:AUTHORITY)% %REQ(:PATH)% code=%RESPONSE_CODE% flags=%RESPONSE_FLAGS% %DURATION%ms\n"
                route_config:
                  name: symagios_gateway_routes
                  virtual_hosts:
                    - name: symagios_gateway
                      domains: ["*"]
                      routes:
                        # OIDC token/login. No JWT yet — this is how a client gets one.
                        # Proxied to Keycloak over mTLS. Not the plaintext :8080 port.
                        - match:
                            prefix: "/realms/symagios/"
                          request_headers_to_add:
                            - header:
                                key: x-forwarded-proto
                                value: https
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            - header:
                                key: x-forwarded-host
                                value: localhost:8443
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            - header:
                                key: x-forwarded-port
                                value: "8443"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          route:
                            cluster: keycloak_jwks
                            timeout: 15s
                        - match:
                            path: "/.well-known/agent-card.json"
                          route:
                            cluster: agent_gateway
                            timeout: 30s
                        - match:
                            path: "/message/send"
                          route:
                            cluster: agent_gateway
                            timeout: 30s
                        - match:
                            path: "/peers"
                            headers:
                              - name: ":method"
                                string_match:
                                  exact: "POST"
                          route:
                            cluster: agent_gateway
                            timeout: 30s
                        - match:
                            path: "/peers"
                            headers:
                              - name: ":method"
                                string_match:
                                  exact: "DELETE"
                          route:
                            cluster: agent_gateway
                            timeout: 30s
                        - match:
                            path: "/tasks/list"
                          route:
                            cluster: agent_gateway
                            timeout: 30s
                        - match:
                            safe_regex:
                              google_re2: {}
                              regex: "^/tasks/[A-Za-z0-9._:~-]+/cancel$"
                          route:
                            cluster: agent_gateway
                            timeout: 30s
                        - match:
                            safe_regex:
                              google_re2: {}
                              regex: "^/tasks/[A-Za-z0-9._:~-]+$"
                          route:
                            cluster: agent_gateway
                            timeout: 30s
                        - match:
                            path: "/agents"
                            headers:
                              - name: ":method"
                                string_match:
                                  exact: "OPTIONS"
                          route:
                            cluster: agent_entry
                            timeout: 10s
                        - match:
                            path: "/agents"
                            headers:
                              - name: ":method"
                                string_match:
                                  exact: "POST"
                          route:
                            cluster: agent_entry
                            timeout: 30s
                        - match:
                            path: "/agents"
                            headers:
                              - name: ":method"
                                string_match:
                                  exact: "GET"
                          route:
                            cluster: agent_entry
                            timeout: 30s
                        - match:
                            safe_regex:
                              google_re2: {}
                              # TUS upload URL is /agents/{session_id}/{agent_name}
                              # (matches agent-entry Location + Go ServeMux routes).
                              regex: "^/agents/[A-Za-z0-9._~%-]+/[A-Za-z0-9._~%-]+$"
                            headers:
                              - name: ":method"
                                string_match:
                                  exact: "HEAD"
                          route:
                            cluster: agent_entry
                            timeout: 30s
                        - match:
                            safe_regex:
                              google_re2: {}
                              regex: "^/agents/[A-Za-z0-9._~%-]+/[A-Za-z0-9._~%-]+$"
                            headers:
                              - name: ":method"
                                string_match:
                                  exact: "PATCH"
                          route:
                            cluster: agent_entry
                            timeout: 60s
                        - match:
                            safe_regex:
                              google_re2: {}
                              regex: "^/agents/[A-Za-z0-9._~%-]+/[A-Za-z0-9._~%-]+$"
                            headers:
                              - name: ":method"
                                string_match:
                                  exact: "DELETE"
                          route:
                            cluster: agent_entry
                            timeout: 30s
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      inline_code: |
                        function envoy_on_request(request_handle)
                          request_handle:headers():add("x-symagios-traffic", "ingress")
                          -- Drop client-supplied identity; jwt_authn claim_to_headers
                          -- sets x-user-id from preferred_username after verification.
                          request_handle:headers():remove("x-user-id")
                        end
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        keycloak:
                          issuer: https://localhost:8443/realms/symagios
                          remote_jwks:
                            http_uri:
                              uri: https://keycloak:8443/realms/symagios/protocol/openid-connect/certs
                              cluster: keycloak_jwks
                              timeout: 5s
                            cache_duration:
                              seconds: 300
                          forward: true
                          forward_payload_header: x-jwt-payload
                          claim_to_headers:
                            - header_name: x-user-id
                              claim_name: preferred_username
                      rules:
                        # Public agent-card discovery — intentional, no JWT.
                        - match:
                            prefix: "/.well-known/"
                        # Login and token. Must not require a bearer token.
                        - match:
                            safe_regex:
                              google_re2: {}
                              regex: "^/realms/symagios/protocol/openid-connect/(token|auth)$"
                        - match:
                            prefix: "/realms/symagios/.well-known/"
                        - match:
                            prefix: "/"
                          requires:
                            provider_name: keycloak
                  # After JWT: flatten realm_access.roles into x-symagios-roles for OPA.
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      inline_code: |
                        local b64chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'

                        local function b64url_decode(data)
                          if data == nil or data == '' then
                            return nil
                          end
                          data = data:gsub('-', '+'):gsub('_', '/')
                          local pad = #data % 4
                          if pad > 0 then
                            data = data .. string.rep('=', 4 - pad)
                          end
                          local result = {}
                          local buf, bits = 0, 0
                          for i = 1, #data do
                            local c = data:sub(i, i)
                            if c ~= '=' then
                              local v = b64chars:find(c, 1, true)
                              if not v then
                                return nil
                              end
                              buf = buf * 64 + (v - 1)
                              bits = bits + 6
                              if bits >= 8 then
                                bits = bits - 8
                                result[#result + 1] = string.char(math.floor(buf / (2 ^ bits)) % 256)
                                buf = buf % (2 ^ bits)
                              end
                            end
                          end
                          return table.concat(result)
                        end

                        local function roles_from_payload(json)
                          if json == nil then
                            return nil
                          end
                          local block = json:match('"realm_access"%s*:%s*{.-"roles"%s*:%s*%[(.-)%]')
                          if not block then
                            return nil
                          end
                          local roles = {}
                          for role in block:gmatch('"([^"]+)"') do
                            roles[#roles + 1] = role
                          end
                          if #roles == 0 then
                            return nil
                          end
                          return table.concat(roles, ',')
                        end

                        function envoy_on_request(request_handle)
                          -- Never trust client-supplied roles; clear first. OPA
                          -- fail-closed when the header is missing/empty.
                          request_handle:headers():remove('x-symagios-roles')
                          local payload = request_handle:headers():get('x-jwt-payload')
                          if payload == nil or payload == '' then
                            return
                          end
                          local json = b64url_decode(payload)
                          local roles = roles_from_payload(json)
                          if roles ~= nil then
                            request_handle:headers():add('x-symagios-roles', roles)
                          end
                        end
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      grpc_service:
                        envoy_grpc:
                          cluster_name: opa_ext_authz
                        timeout: 0.5s
                      # Fail closed if OPA is unreachable — intentional.
                      failure_mode_allow: false
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # East-west mTLS to agent-gateway (Go listens TLS :8443, requires client cert).
    - name: agent_gateway
      type: STRICT_DNS
      connect_timeout: 5s
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: agent-gateway.symagios.local
          common_tls_context:
            tls_certificates:
              - certificate_chain:
                  filename: /certs/envoy-ingress/tls.crt
                private_key:
                  filename: /certs/envoy-ingress/tls.key
            validation_context:
              trusted_ca:
                filename: /certs/ca.crt
              match_typed_subject_alt_names:
                - san_type: DNS
                  matcher:
                    exact: agent-gateway.symagios.local
      health_checks:
        - timeout: 2s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 1
          tcp_health_check: {}
          always_log_health_check_failures: true
      outlier_detection:
        consecutive_5xx: 3
        interval: 10s
        base_ejection_time: 30s
        max_ejection_percent: 100
      load_assignment:
        cluster_name: agent_gateway
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: agent-gateway
                      port_value: 8443

    # East-west mTLS to agent-entry (TUS). Go listens TLS :8443, requires client cert.
    - name: agent_entry
      type: STRICT_DNS
      connect_timeout: 5s
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: agent-entry.symagios.local
          common_tls_context:
            tls_certificates:
              - certificate_chain:
                  filename: /certs/envoy-ingress/tls.crt
                private_key:
                  filename: /certs/envoy-ingress/tls.key
            validation_context:
              trusted_ca:
                filename: /certs/ca.crt
              match_typed_subject_alt_names:
                - san_type: DNS
                  matcher:
                    exact: agent-entry.symagios.local
      health_checks:
        - timeout: 2s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 1
          tcp_health_check: {}
          always_log_health_check_failures: true
      outlier_detection:
        consecutive_5xx: 3
        interval: 10s
        base_ejection_time: 30s
        max_ejection_percent: 100
      load_assignment:
        cluster_name: agent_entry
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: agent-entry
                      port_value: 8443

    # Envoy → Keycloak JWKS is mTLS. Keycloak HTTPS :8443 requires Envoy's client cert.
    # Token/admin for local CLI stay on HTTP :8080 (start-dev). Issuer is unchanged.
    - name: keycloak_jwks
      type: STRICT_DNS
      connect_timeout: 5s
      dns_lookup_family: V4_ONLY
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: keycloak.symagios.local
          common_tls_context:
            tls_certificates:
              - certificate_chain:
                  filename: /certs/envoy-ingress/tls.crt
                private_key:
                  filename: /certs/envoy-ingress/tls.key
            validation_context:
              trusted_ca:
                filename: /certs/ca.crt
              match_typed_subject_alt_names:
                - san_type: DNS
                  matcher:
                    exact: keycloak.symagios.local
      health_checks:
        - timeout: 2s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 1
          tcp_health_check: {}
          always_log_health_check_failures: true
      outlier_detection:
        consecutive_5xx: 3
        interval: 10s
        base_ejection_time: 30s
        max_ejection_percent: 100
      load_assignment:
        cluster_name: keycloak_jwks
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: keycloak
                      port_value: 8443

    # Mesh hardening: OPA gRPC is not published on the host (compose).
    # Optional mTLS: set SYMAGIOS_OPA_GRPC_TLS=1 and mount /certs/opa; then add
    # transport_socket UpstreamTlsContext pointing at /certs/opa (see deploy/docs/mesh-hardening.md).
    - name: opa_ext_authz
      type: STRICT_DNS
      connect_timeout: 5s
      health_checks:
        - timeout: 2s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 1
          tcp_health_check: {}
          always_log_health_check_failures: true
      outlier_detection:
        consecutive_5xx: 3
        interval: 10s
        base_ejection_time: 30s
        max_ejection_percent: 100
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: opa_ext_authz
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: opa
                      port_value: 9191
